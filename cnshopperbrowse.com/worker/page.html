const FAQS={"en": [["What is this spreadsheet?", "An independent catalog of seller listings, photos and links for shoppers using CNShopper."], ["Is this the official CNShopper website?", "No. Registration, payments, orders and support are handled on the official CNShopper website."], ["How do I order an item?", "Open a listing, select “Open on CNShopper”, and confirm the product, options and current price there."], ["Are the photos real product photos?", "Images come from the product catalog. They are seller photos unless explicitly identified as warehouse QC photos."], ["What are QC photos?", "Warehouse inspection photos help you review an item after it arrives at the agent’s warehouse. They do not guarantee authenticity."], ["Does every listing have QC photos?", "No. If separate QC photos are unavailable, the product page says so."], ["Does the displayed price include shipping?", "No. Agent fees, domestic shipping, international shipping and any taxes may add to the total."], ["Why can prices change?", "Seller prices, exchange rates, stock and agent charges can change. Confirm the final amount at checkout."], ["Can I pay on this website?", "No. This directory does not accept payments or handle checkout."], ["Do I need a CNShopper account?", "You can browse here without an account. CNShopper may require an account to order and manage parcels."], ["How do I choose a size?", "Review the seller’s size chart and measurements on the purchase page; do not rely on size letters alone."], ["Are all colors available?", "Check live stock and colorways on the CNShopper purchase page. A catalog photo does not confirm stock."], ["How is international shipping calculated?", "The quote depends on destination, route, parcel weight and dimensions. Check CNShopper’s current shipping estimate."], ["What is volumetric weight?", "Some routes charge for the space a parcel occupies. The applicable formula and divisor depend on the shipping route."], ["How long does delivery take?", "Timing depends on seller dispatch, warehouse processing, the selected route and customs. Use the current route estimate."], ["Can I combine products into one parcel?", "CNShopper offers parcel consolidation. Check route restrictions and the eligible items in your account."], ["Can I return a product?", "Eligibility depends on the seller, item, timing and order status. Contact CNShopper before requesting a return."], ["Are customs charges included?", "This depends on the shipping route and destination. Read the route’s current tax terms before payment."], ["Where are my saved products stored?", "Your shortlist is stored in this browser on this device. Clearing browser data removes it."], ["What if a product link stops working?", "Try again later. If the seller removed the item or the link is unavailable, search for another listing."]], "de": [["Was ist dieses Spreadsheet?", "Ein unabhängiger Katalog mit Verkäuferangeboten, Fotos und Links für CNShopper-Nutzer."], ["Ist dies die offizielle CNShopper-Seite?", "Nein. Registrierung, Zahlung, Bestellungen und Support erfolgen direkt bei CNShopper."], ["Wie bestelle ich?", "Öffne einen Artikel, wähle „Bei CNShopper öffnen“ und bestätige dort Produkt, Optionen und Preis."], ["Sind dies echte Produktfotos?", "Die Bilder stammen aus dem Produktkatalog. Sie sind Verkäuferfotos, sofern nicht ausdrücklich als QC-Fotos gekennzeichnet."], ["Was sind QC-Fotos?", "Lagerfotos helfen, den eingetroffenen Artikel zu prüfen. Sie garantieren keine Echtheit."], ["Gibt es für jeden Artikel QC-Fotos?", "Nein. Fehlende separate QC-Fotos werden auf der Produktseite kenntlich gemacht."], ["Ist Versand im Preis enthalten?", "Nein. Agentengebühren, Inlandsversand, internationaler Versand und Steuern können hinzukommen."], ["Warum ändern sich Preise?", "Verkäuferpreise, Wechselkurse, Bestand und Gebühren können sich ändern. Prüfe den Endpreis beim Bezahlen."], ["Kann ich hier bezahlen?", "Nein. Dieses Verzeichnis nimmt keine Zahlungen entgegen."], ["Brauche ich ein CNShopper-Konto?", "Hier kannst du ohne Konto stöbern. Für Bestellungen und Pakete kann CNShopper ein Konto verlangen."], ["Wie wähle ich eine Größe?", "Prüfe die Maßtabelle des Verkäufers. Verlasse dich nicht nur auf Größenbuchstaben."], ["Sind alle Farben verfügbar?", "Prüfe Farben und Bestand auf der CNShopper-Kaufseite. Ein Foto bestätigt keinen Lagerbestand."], ["Wie wird Versand berechnet?", "Zielland, Route, Gewicht und Maße bestimmen den Preis. Prüfe den aktuellen CNShopper-Versandrechner."], ["Was ist Volumengewicht?", "Manche Routen berechnen den Platzbedarf. Formel und Divisor hängen von der Route ab."], ["Wie lange dauert die Lieferung?", "Verkäufer, Lagerbearbeitung, Versandroute und Zoll bestimmen die Dauer. Prüfe die aktuelle Schätzung."], ["Kann ich Artikel zusammen versenden?", "CNShopper bietet Paketkonsolidierung. Prüfe geeignete Artikel und Routenbeschränkungen in deinem Konto."], ["Kann ich einen Artikel zurückgeben?", "Das hängt von Verkäufer, Artikel, Frist und Bestellstatus ab. Kontaktiere zuerst CNShopper."], ["Sind Zollgebühren enthalten?", "Das hängt von Route und Zielland ab. Prüfe vor dem Bezahlen die Steuerbedingungen."], ["Wo wird meine Merkliste gespeichert?", "Lokal in diesem Browser auf diesem Gerät. Beim Löschen der Browserdaten geht sie verloren."], ["Was mache ich bei einem defekten Link?", "Versuche es später erneut. Bei gelöschten Angeboten suche einen anderen Artikel."]], "fr": [["Qu’est-ce que ce spreadsheet ?", "Un catalogue indépendant d’annonces, de photos et de liens pour les utilisateurs de CNShopper."], ["Est-ce le site officiel CNShopper ?", "Non. Inscriptions, paiements, commandes et assistance sont gérés sur le site officiel."], ["Comment commander ?", "Ouvrez une fiche, puis « Ouvrir sur CNShopper ». Confirmez le produit, les options et le prix."], ["Les photos sont-elles réelles ?", "Elles proviennent du catalogue. Ce sont des photos vendeur, sauf mention explicite de photos QC."], ["Que sont les photos QC ?", "Des photos de contrôle prises à l’entrepôt après réception. Elles ne garantissent pas l’authenticité."], ["Chaque article a-t-il des photos QC ?", "Non. L’absence de photos QC distinctes est indiquée sur la fiche."], ["Le prix inclut-il la livraison ?", "Non. Frais d’agent, livraison locale et internationale et taxes peuvent s’ajouter."], ["Pourquoi le prix peut-il changer ?", "Les prix vendeurs, taux de change, stocks et frais évoluent. Confirmez le total au paiement."], ["Puis-je payer ici ?", "Non. Ce catalogue ne prend pas en charge les paiements."], ["Faut-il un compte CNShopper ?", "Pas pour consulter ce site. CNShopper peut exiger un compte pour commander et gérer les colis."], ["Comment choisir une taille ?", "Vérifiez les mesures du vendeur sur la page d’achat. Les lettres de taille ne suffisent pas."], ["Toutes les couleurs sont-elles disponibles ?", "Vérifiez les coloris et le stock sur CNShopper. Une photo ne garantit pas la disponibilité."], ["Comment est calculée la livraison ?", "Le tarif dépend de la destination, de la ligne, du poids et des dimensions. Consultez l’estimation actuelle."], ["Qu’est-ce que le poids volumétrique ?", "Certaines lignes facturent l’espace occupé. La formule dépend du transporteur et de la ligne."], ["Quel est le délai de livraison ?", "Il dépend du vendeur, de l’entrepôt, de la ligne et des douanes. Consultez le délai estimé actuel."], ["Puis-je regrouper mes achats ?", "CNShopper propose le regroupement. Vérifiez les articles éligibles et les restrictions dans votre compte."], ["Puis-je retourner un produit ?", "Cela dépend du vendeur, du produit, du délai et de la commande. Contactez CNShopper en premier."], ["Les droits de douane sont-ils inclus ?", "Cela dépend de la destination et de la ligne. Lisez les conditions fiscales avant de payer."], ["Où sont enregistrés mes favoris ?", "Dans ce navigateur sur cet appareil. Effacer les données du navigateur les supprime."], ["Que faire si un lien ne fonctionne plus ?", "Réessayez plus tard. Si le vendeur a retiré l’article, recherchez une autre annonce."]], "es": [["¿Qué es este spreadsheet?", "Un catálogo independiente de anuncios, fotos y enlaces para usuarios de CNShopper."], ["¿Es el sitio oficial de CNShopper?", "No. Registro, pagos, pedidos y soporte se realizan en el sitio oficial."], ["¿Cómo compro un artículo?", "Abre una ficha, pulsa «Abrir en CNShopper» y confirma producto, opciones y precio."], ["¿Las fotos son reales?", "Proceden del catálogo. Son fotos del vendedor salvo que se identifiquen expresamente como fotos QC."], ["¿Qué son las fotos QC?", "Son fotos de inspección tras la llegada al almacén. No garantizan la autenticidad."], ["¿Todos los artículos tienen fotos QC?", "No. La ficha indica cuando no hay fotos QC separadas."], ["¿El precio incluye el envío?", "No. Pueden añadirse comisiones, envío local e internacional e impuestos."], ["¿Por qué cambia el precio?", "Precios, cambio de divisas, existencias y comisiones varían. Confirma el importe al pagar."], ["¿Puedo pagar aquí?", "No. Este directorio no acepta pagos."], ["¿Necesito una cuenta CNShopper?", "Puedes navegar aquí sin cuenta. CNShopper puede exigirla para pedidos y paquetes."], ["¿Cómo elijo la talla?", "Revisa las medidas del vendedor en la página de compra; no te fíes solo de las letras."], ["¿Están disponibles todos los colores?", "Comprueba colores y existencias en CNShopper. Una foto no confirma disponibilidad."], ["¿Cómo se calcula el envío?", "Depende del destino, ruta, peso y dimensiones. Consulta la estimación actual de CNShopper."], ["¿Qué es el peso volumétrico?", "Algunas rutas cobran por el espacio ocupado. La fórmula depende de la ruta."], ["¿Cuánto tarda la entrega?", "Depende del vendedor, almacén, ruta y aduanas. Consulta la estimación actual."], ["¿Puedo combinar artículos?", "CNShopper ofrece consolidación. Revisa los artículos y las restricciones de la ruta en tu cuenta."], ["¿Puedo devolver un producto?", "Depende del vendedor, artículo, plazo y estado del pedido. Contacta primero con CNShopper."], ["¿Se incluyen las aduanas?", "Depende de la ruta y el destino. Lee las condiciones fiscales antes de pagar."], ["¿Dónde se guardan mis favoritos?", "En este navegador y dispositivo. Al borrar sus datos se eliminan los favoritos."], ["¿Qué pasa si falla un enlace?", "Inténtalo más tarde. Si el vendedor lo ha retirado, busca otro anuncio."]], "it": [["Che cos’è questo spreadsheet?", "Un catalogo indipendente di annunci, foto e link per gli utenti di CNShopper."], ["È il sito ufficiale CNShopper?", "No. Registrazione, pagamenti, ordini e assistenza sono gestiti dal sito ufficiale."], ["Come ordino un articolo?", "Apri una scheda, seleziona «Apri su CNShopper» e conferma prodotto, opzioni e prezzo."], ["Le foto sono reali?", "Provengono dal catalogo. Sono foto del venditore salvo esplicita indicazione di foto QC."], ["Cosa sono le foto QC?", "Foto di controllo scattate dopo l’arrivo in magazzino. Non garantiscono l’autenticità."], ["Ogni articolo ha foto QC?", "No. L’assenza di foto QC separate viene indicata nella scheda."], ["Il prezzo include la spedizione?", "No. Si possono aggiungere commissioni, spedizione locale e internazionale e imposte."], ["Perché i prezzi cambiano?", "Prezzi, tassi di cambio, disponibilità e commissioni possono cambiare. Verifica il totale al pagamento."], ["Posso pagare qui?", "No. Questo catalogo non accetta pagamenti."], ["Serve un account CNShopper?", "Non per navigare qui. CNShopper può richiedere un account per ordini e pacchi."], ["Come scelgo la taglia?", "Controlla le misure del venditore nella pagina di acquisto; non basarti solo sulle lettere."], ["Sono disponibili tutti i colori?", "Controlla colori e disponibilità su CNShopper. Una foto non conferma le scorte."], ["Come si calcola la spedizione?", "Dipende da destinazione, linea, peso e dimensioni. Consulta la stima attuale di CNShopper."], ["Cos’è il peso volumetrico?", "Alcune linee addebitano lo spazio occupato. La formula dipende dalla linea."], ["Quanto dura la consegna?", "Dipende da venditore, magazzino, linea e dogana. Consulta la stima attuale."], ["Posso unire più acquisti?", "CNShopper offre il consolidamento. Controlla gli articoli idonei e le restrizioni nel tuo account."], ["Posso restituire un prodotto?", "Dipende da venditore, articolo, scadenza e stato dell’ordine. Contatta prima CNShopper."], ["Le spese doganali sono incluse?", "Dipende dalla linea e dalla destinazione. Leggi le condizioni fiscali prima di pagare."], ["Dove sono salvati i preferiti?", "In questo browser su questo dispositivo. Cancellando i dati si eliminano anche i preferiti."], ["Cosa faccio se un link non funziona?", "Riprova più tardi. Se il venditore ha rimosso il prodotto, cerca un altro annuncio."]], "pt": [["O que é este spreadsheet?", "Um catálogo independente de anúncios, fotos e links para utilizadores do CNShopper."], ["É o site oficial do CNShopper?", "Não. Registos, pagamentos, encomendas e apoio são tratados no site oficial."], ["Como encomendo um artigo?", "Abra a ficha, escolha «Abrir no CNShopper» e confirme produto, opções e preço."], ["As fotos são reais?", "São provenientes do catálogo. São fotos do vendedor, salvo indicação explícita de fotos QC."], ["O que são fotos QC?", "Fotos de inspeção após a chegada ao armazém. Não garantem a autenticidade."], ["Todos os artigos têm fotos QC?", "Não. A falta de fotos QC separadas é indicada na ficha."], ["O preço inclui envio?", "Não. Podem acrescer taxas, envio local e internacional e impostos."], ["Porque mudam os preços?", "Preços, câmbio, stock e taxas podem mudar. Confirme o total no pagamento."], ["Posso pagar aqui?", "Não. Este catálogo não aceita pagamentos."], ["Preciso de conta CNShopper?", "Não para navegar aqui. O CNShopper pode exigir conta para encomendas e volumes."], ["Como escolho o tamanho?", "Consulte as medidas do vendedor na página de compra; não confie apenas nas letras."], ["Todas as cores estão disponíveis?", "Verifique cores e stock no CNShopper. Uma foto não garante disponibilidade."], ["Como é calculado o envio?", "Depende do destino, rota, peso e dimensões. Consulte a estimativa atual do CNShopper."], ["O que é peso volumétrico?", "Algumas rotas cobram pelo espaço ocupado. A fórmula depende da rota."], ["Quanto demora a entrega?", "Depende do vendedor, armazém, rota e alfândega. Consulte a estimativa atual."], ["Posso juntar artigos?", "O CNShopper oferece consolidação. Verifique artigos elegíveis e restrições na sua conta."], ["Posso devolver um produto?", "Depende do vendedor, artigo, prazo e estado da encomenda. Contacte primeiro o CNShopper."], ["As taxas aduaneiras estão incluídas?", "Depende da rota e destino. Leia as condições fiscais antes de pagar."], ["Onde ficam os favoritos?", "Neste navegador e dispositivo. Limpar os dados do navegador elimina os favoritos."], ["E se um link deixar de funcionar?", "Tente mais tarde. Se o vendedor removeu o artigo, procure outro anúncio."]]};

function bithex(bits){let s='';for(let i=0;i<bits.length;i+=4)s+=(bits[i]*8+bits[i+1]*4+bits[i+2]*2+bits[i+3]).toString(16);return s}
async function imageFeatures(file){const bitmap=await createImageBitmap(file);const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});function pixels(w,h){canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(bitmap,0,0,w,h);return ctx.getImageData(0,0,w,h).data;}const gray=(data)=>Array.from({length:data.length/4},(_,i)=>Math.round(data[i*4]*.299+data[i*4+1]*.587+data[i*4+2]*.114));const g=gray(pixels(32,32)),D=Array.from({length:8},(_,k)=>Array.from({length:32},(_,n)=>Math.cos(Math.PI*(2*n+1)*k/64)));const coeff=[];for(let ky=0;ky<8;ky++)for(let kx=0;kx<8;kx++){let sum=0;for(let y=0;y<32;y++)for(let x=0;x<32;x++)sum+=g[y*32+x]*D[ky][y]*D[kx][x];coeff.push(sum)}const sorted=coeff.slice(1).sort((a,b)=>a-b),med=sorted[31];const dh=gray(pixels(9,8)),bits=[];for(let y=0;y<8;y++)for(let x=0;x<8;x++)bits.push(+(dh[y*9+x+1]>dh[y*9+x]));const rgba=pixels(4,4),c=[];for(let i=0;i<rgba.length;i+=4)c.push(rgba[i],rgba[i+1],rgba[i+2]);const result={p:bithex(coeff.map(v=>+(v>med))),h:bithex(bits),c,a:bitmap.width/bitmap.height};bitmap.close();return result}
const popcount=[0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4];function hashDistance(a,b){let n=0;for(let i=0;i<16;i++)n+=popcount[parseInt(a[i],16)^parseInt(b[i],16)];return n}
function featureDistance(a,b){const color=a.c.reduce((n,v,i)=>n+Math.abs(v-b.c[i]),0)/48/255;return hashDistance(a.p,b.p)*.65+hashDistance(a.h,b.h)*.35+color*20+Math.min(5,Math.abs(Math.log(a.a/b.a))*3)}
function setupImageSearch(version){const input=document.getElementById('search-file'),drop=document.getElementById('drop-zone');api('/api/coverage').then(m=>{if(version!==loadVersion)return;document.getElementById('search-coverage').textContent=Number(m.products).toLocaleString(lang)+' '+t('products')+' · '+Number(m.indexedImages).toLocaleString(lang)+' / '+Number(m.totalImages).toLocaleString(lang)+' '+t('imageCount')+' · '+imageScopeNotes[lang]+(m.indexedImages<m.totalImages?' · '+t('pendingImages'):'');});input.onchange=()=>run(input.files[0]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('dragging')};drop.ondragleave=()=>drop.classList.remove('dragging');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('dragging');run(e.dataTransfer.files[0])};

nput.disabled=false;}}
