<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OOPBUY parcel reinforcement cost and damage-risk decision</title>
  <desc id="desc">An editorial decision diagram comparing item exposure, packaging evidence, route handling and the live reinforcement quote.</desc>
  <rect width="1200" height="675" fill="#081321"/>
  <path d="M0 88h1200M0 590h1200" stroke="#233348"/>
  <text x="72" y="68" fill="#f5f0e6" font-family="Arial, sans-serif" font-size="28" font-weight="700">PARCEL REINFORCEMENT DECISION</text>
  <text x="72" y="118" fill="#f26430" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">COST × EXPOSURE × EVIDENCE</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="175" width="290" height="255" rx="12" fill="#f5f0e6"/>
    <text x="102" y="222" fill="#081321" font-size="20" font-weight="700">1 · ITEM EXPOSURE</text>
    <text x="102" y="272" fill="#30445e" font-size="18">Fragile surfaces</text>
    <text x="102" y="307" fill="#30445e" font-size="18">Empty space</text>
    <text x="102" y="342" fill="#30445e" font-size="18">Mixed weights</text>
    <text x="102" y="377" fill="#30445e" font-size="18">Replacement difficulty</text>
    <rect x="455" y="175" width="290" height="255" rx="12" fill="#eef2f6"/>
    <text x="485" y="222" fill="#081321" font-size="20" font-weight="700">2 · PARCEL EVIDENCE</text>
    <text x="485" y="272" fill="#30445e" font-size="18">QC and packaging state</text>
    <text x="485" y="307" fill="#30445e" font-size="18">Packed weight</text>
    <text x="485" y="342" fill="#30445e" font-size="18">Packed dimensions</text>
    <text x="485" y="377" fill="#30445e" font-size="18">Eligible route</text>
    <rect x="838" y="175" width="290" height="255" rx="12" fill="#f5f0e6"/>
    <text x="868" y="222" fill="#081321" font-size="20" font-weight="700">3 · LIVE QUOTE</text>
    <text x="868" y="272" fill="#30445e" font-size="18">Service price</text>
    <text x="868" y="307" fill="#30445e" font-size="18">Weight change</text>
    <text x="868" y="342" fill="#30445e" font-size="18">Dimension change</text>
    <text x="868" y="377" fill="#30445e" font-size="18">Expected loss avoided</text>
    <path d="M362 302h73m-18-18 18 18-18 18M745 302h73m-18-18 18 18-18 18" stroke="#f26430" stroke-width="5" fill="none"/>
    <rect x="260" y="493" width="680" height="72" rx="36" fill="#f26430"/>
    <text x="600" y="538" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">BUY PROTECTION ONLY WHEN THE LIVE EVIDENCE JUSTIFIES IT</text>
  </g>
</svg>
