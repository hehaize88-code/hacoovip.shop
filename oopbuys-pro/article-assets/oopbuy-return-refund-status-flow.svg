<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OOPBUY return and refund decision flow</title>
  <desc id="desc">A four-stage decision flow that starts with the live order status, checks return eligibility and packaging, identifies costs and responsibility, and verifies the final refund destination.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16215b" flood-opacity=".12"/></filter>
    <style>
      .title{font:800 38px Arial,sans-serif;fill:#101a4a}.sub{font:500 18px Arial,sans-serif;fill:#57607a}.num{font:800 17px Arial,sans-serif;fill:#fff}.head{font:800 22px Arial,sans-serif;fill:#101a4a}.body{font:500 16px Arial,sans-serif;fill:#3d4663}.small{font:700 14px Arial,sans-serif;fill:#57607a}.arrow{fill:none;stroke:#ff2c79;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#fbf8f1"/>
  <circle cx="1090" cy="82" r="115" fill="#ffe2ed"/>
  <circle cx="82" cy="610" r="105" fill="#e4edff"/>
  <text x="70" y="78" class="title">OOPBUY return &amp; refund decision flow</text>
  <text x="70" y="111" class="sub">Do not treat cancellation, warehouse return and bank refund as one event.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="240" height="340" rx="25" fill="#fff" stroke="#d9ddea"/>
    <circle cx="111" cy="205" r="25" fill="#14215c"/><text x="106" y="211" class="num">1</text>
    <text x="145" y="199" class="head">Record status</text>
    <text x="145" y="226" class="small">AND TIMESTAMP</text>
    <text x="96" y="278" class="body"><tspan x="96" dy="0">Process Pending?</tspan><tspan x="96" dy="30">Processing?</tspan><tspan x="96" dy="30">Purchased / Seller Sent?</tspan><tspan x="96" dy="30">Stored?</tspan></text>
    <rect x="94" y="403" width="192" height="66" rx="16" fill="#edf1ff"/>
    <text x="112" y="430" class="small">For Stored items:</text><text x="112" y="454" class="body">save the 120h display</text>
  </g>

  <path d="M322 330h45m-15-14 15 14-15 14" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="380" y="160" width="240" height="340" rx="25" fill="#fff" stroke="#d9ddea"/>
    <circle cx="421" cy="205" r="25" fill="#ff2c79"/><text x="416" y="211" class="num">2</text>
    <text x="455" y="199" class="head">Test eligibility</text>
    <text x="455" y="226" class="small">BEFORE REQUESTING</text>
    <text x="406" y="278" class="body"><tspan x="406" dy="0">Seller supports return?</tspan><tspan x="406" dy="30">Still resalable?</tspan><tspan x="406" dy="30">Tags and seals intact?</tspan><tspan x="406" dy="30">Inside live window?</tspan></text>
    <rect x="404" y="403" width="192" height="66" rx="16" fill="#ffe5ef"/>
    <text x="422" y="430" class="small">Evidence:</text><text x="422" y="454" class="body">order option + QC proof</text>
  </g>

  <path d="M632 330h45m-15-14 15 14-15 14" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="690" y="160" width="240" height="340" rx="25" fill="#fff" stroke="#d9ddea"/>
    <circle cx="731" cy="205" r="25" fill="#f59b3d"/><text x="726" y="211" class="num">3</text>
    <text x="765" y="199" class="head">Assign costs</text>
    <text x="765" y="226" class="small">AND RESPONSIBILITY</text>
    <text x="716" y="278" class="body"><tspan x="716" dy="0">Buyer preference?</tspan><tspan x="716" dy="30">Wrong seller item?</tspan><tspan x="716" dy="30">Visible quality issue?</tspan><tspan x="716" dy="30">Domestic transit damage?</tspan></text>
    <rect x="714" y="403" width="192" height="66" rx="16" fill="#fff0dd"/>
    <text x="732" y="430" class="small">Check live amount:</text><text x="732" y="454" class="body">shipping + service fee</text>
  </g>

  <path d="M942 330h45m-15-14 15 14-15 14" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="1000" y="160" width="130" height="340" rx="25" fill="#14215c"/>
    <circle cx="1041" cy="205" r="25" fill="#fff"/><text x="1036" y="211" style="font:800 17px Arial,sans-serif;fill:#14215c">4</text>
    <text x="1024" y="258" style="font:800 20px Arial,sans-serif;fill:#fff"><tspan x="1024">Verify</tspan><tspan x="1024" dy="25">refund</tspan></text>
    <text x="1024" y="338" style="font:500 15px Arial,sans-serif;fill:#dce4ff"><tspan x="1024">Wallet?</tspan><tspan x="1024" dy="27">Card?</tspan><tspan x="1024" dy="27">Amount?</tspan><tspan x="1024" dy="27">Reference?</tspan></text>
  </g>

  <rect x="238" y="548" width="724" height="78" rx="23" fill="#ffdd5d"/>
  <text x="600" y="580" text-anchor="middle" class="head">A request is not a completed refund.</text>
  <text x="600" y="607" text-anchor="middle" class="body">Track approval → physical return → seller refund → money receipt.</text>
</svg>
