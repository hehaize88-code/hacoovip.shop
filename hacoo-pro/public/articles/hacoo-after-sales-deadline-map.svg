<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hacoo after-sales deadline and evidence map</title>
  <desc id="desc">A three-stage editorial diagram showing delivery evidence, issue documentation, and request submission before the published deadline.</desc>
  <rect width="1200" height="630" fill="#f5f1e8"/>
  <rect x="70" y="76" width="1060" height="478" rx="32" fill="#fffdf8" stroke="#173c36" stroke-width="4"/>
  <text x="108" y="145" fill="#173c36" font-family="Arial, sans-serif" font-size="38" font-weight="700">After-sales request: work backward from the deadline</text>
  <path d="M165 318H1035" stroke="#c56942" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="245" cy="318" r="52" fill="#173c36"/>
    <text x="245" y="330" fill="#fff" font-size="34" font-weight="700">1</text>
    <text x="245" y="410" fill="#173c36" font-size="25" font-weight="700">Anchor the date</text>
    <text x="245" y="446" fill="#465f59" font-size="20">Save delivery status</text>
    <circle cx="600" cy="318" r="52" fill="#173c36"/>
    <text x="600" y="330" fill="#fff" font-size="34" font-weight="700">2</text>
    <text x="600" y="410" fill="#173c36" font-size="25" font-weight="700">Document the issue</text>
    <text x="600" y="446" fill="#465f59" font-size="20">Match item, option, evidence</text>
    <circle cx="955" cy="318" r="52" fill="#173c36"/>
    <text x="955" y="330" fill="#fff" font-size="34" font-weight="700">3</text>
    <text x="955" y="410" fill="#173c36" font-size="25" font-weight="700">Submit and preserve</text>
    <text x="955" y="446" fill="#465f59" font-size="20">Keep time and case record</text>
  </g>
  <text x="600" y="511" fill="#8f3e25" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Do not wait for perfect evidence if the published window is closing.</text>
</svg>
