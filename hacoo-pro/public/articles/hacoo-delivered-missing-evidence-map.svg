<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Delivered but missing parcel evidence path</title><desc id="desc">A four-stage path from saving the carrier event to checking handoff locations, opening a carrier trace and preserving one support timeline.</desc>
  <rect width="1200" height="630" fill="#f6f4ee"/><rect x="55" y="55" width="1090" height="520" rx="34" fill="#171715"/>
  <text x="95" y="128" fill="#d7ff62" font-family="Arial,sans-serif" font-size="24" font-weight="700">DELIVERED SCAN ≠ PARCEL IN HAND</text>
  <text x="95" y="174" fill="#ffffff" font-family="Arial,sans-serif" font-size="38" font-weight="700">Build one missing-delivery evidence path</text>
  <g font-family="Arial,sans-serif"><g transform="translate(95 230)"><rect width="225" height="245" rx="22" fill="#fff"/><text x="22" y="48" fill="#e7653b" font-size="18" font-weight="700">01 / FREEZE</text><text x="22" y="88" fill="#171715" font-size="24" font-weight="700">Save the event</text><text x="22" y="126" fill="#595952" font-size="17">Carrier, wording,</text><text x="22" y="153" fill="#595952" font-size="17">time and proof.</text></g>
  <g transform="translate(355 230)"><rect width="225" height="245" rx="22" fill="#fff"/><text x="22" y="48" fill="#e7653b" font-size="18" font-weight="700">02 / SEARCH</text><text x="22" y="88" fill="#171715" font-size="24" font-weight="700">Check handoffs</text><text x="22" y="126" fill="#595952" font-size="17">Mailbox, safe place,</text><text x="22" y="153" fill="#595952" font-size="17">household, reception.</text></g>
  <g transform="translate(615 230)"><rect width="225" height="245" rx="22" fill="#fff"/><text x="22" y="48" fill="#e7653b" font-size="18" font-weight="700">03 / TRACE</text><text x="22" y="88" fill="#171715" font-size="24" font-weight="700">Contact carrier</text><text x="22" y="126" fill="#595952" font-size="17">State one mismatch</text><text x="22" y="153" fill="#595952" font-size="17">and save case ID.</text></g>
  <g transform="translate(875 230)"><rect width="225" height="245" rx="22" fill="#d7ff62"/><text x="22" y="48" fill="#171715" font-size="18" font-weight="700">04 / PRESERVE</text><text x="22" y="88" fill="#171715" font-size="24" font-weight="700">One timeline</text><text x="22" y="126" fill="#31312d" font-size="17">Order, carrier and</text><text x="22" y="153" fill="#31312d" font-size="17">support evidence.</text></g></g>
  <text x="95" y="535" fill="#aaa99f" font-family="Arial,sans-serif" font-size="17">Keep full order, address and tracking data inside official support channels.</text>
</svg>
