<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hacoo preorder support status map</title>
  <desc id="desc">A three-stage editorial diagram moving from item availability to shipment assignment and a precise support question.</desc>
  <rect width="1200" height="630" fill="#f6f4ee"/>
  <rect x="62" y="58" width="1076" height="514" rx="32" fill="#ffffff" stroke="#d8d4c9" stroke-width="2"/>
  <text x="104" y="126" fill="#171715" font-family="Arial, sans-serif" font-size="25" font-weight="700">PREORDER SUPPORT / STATUS MAP</text>
  <text x="104" y="165" fill="#696860" font-family="Arial, sans-serif" font-size="18">Preserve what the order shows, then ask only what the record cannot answer.</text>
  <line x1="220" y1="326" x2="980" y2="326" stroke="#171715" stroke-width="4"/>
  <circle cx="220" cy="326" r="54" fill="#dfff46" stroke="#171715" stroke-width="4"/>
  <circle cx="600" cy="326" r="54" fill="#ff6a37" stroke="#171715" stroke-width="4"/>
  <circle cx="980" cy="326" r="54" fill="#171715" stroke="#171715" stroke-width="4"/>
  <text x="220" y="335" text-anchor="middle" fill="#171715" font-family="Arial, sans-serif" font-size="24" font-weight="700">01</text>
  <text x="600" y="335" text-anchor="middle" fill="#171715" font-family="Arial, sans-serif" font-size="24" font-weight="700">02</text>
  <text x="980" y="335" text-anchor="middle" fill="#dfff46" font-family="Arial, sans-serif" font-size="24" font-weight="700">03</text>
  <text x="220" y="424" text-anchor="middle" fill="#171715" font-family="Arial, sans-serif" font-size="21" font-weight="700">SAVE ITEM STATUS</text>
  <text x="220" y="454" text-anchor="middle" fill="#696860" font-family="Arial, sans-serif" font-size="16">variant · quantity · date</text>
  <text x="600" y="424" text-anchor="middle" fill="#171715" font-family="Arial, sans-serif" font-size="21" font-weight="700">CHECK SHIPMENT</text>
  <text x="600" y="454" text-anchor="middle" fill="#696860" font-family="Arial, sans-serif" font-size="16">carrier · tracking · assignment</text>
  <text x="980" y="424" text-anchor="middle" fill="#171715" font-family="Arial, sans-serif" font-size="21" font-weight="700">ASK ONE QUESTION</text>
  <text x="980" y="454" text-anchor="middle" fill="#696860" font-family="Arial, sans-serif" font-size="16">availability or fulfilment?</text>
  <text x="104" y="530" fill="#ff6a37" font-family="Arial, sans-serif" font-size="16" font-weight="700">HACOO PRO EDITORIAL · ORIGINAL DIAGRAM · AUGUST 2026</text>
</svg>
