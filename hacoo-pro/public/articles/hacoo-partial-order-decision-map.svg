<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hacoo partial order decision map</title>
  <desc id="desc">A three-step diagram for matching order lines, tracking references and received items before reporting a missing Hacoo item.</desc>
  <rect width="1200" height="630" fill="#f3eee5"/>
  <rect x="48" y="48" width="1104" height="534" rx="34" fill="#fffdf8" stroke="#1c1b19" stroke-width="3"/>
  <text x="92" y="124" fill="#80704f" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">PARTIAL ORDER CHECK</text>
  <text x="92" y="178" fill="#151412" font-family="Arial, sans-serif" font-size="40" font-weight="800">Split shipment or missing item?</text>
  <line x1="92" y1="213" x2="1108" y2="213" stroke="#d8cebd" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <rect x="92" y="260" width="286" height="202" rx="22" fill="#151412"/>
    <circle cx="132" cy="305" r="20" fill="#d6fa5f"/>
    <text x="126" y="313" fill="#151412" font-size="22" font-weight="800">1</text>
    <text x="170" y="313" fill="#ffffff" font-size="24" font-weight="800">Order lines</text>
    <text x="124" y="356" fill="#d9d5cc" font-size="19">List every item, quantity</text>
    <text x="124" y="386" fill="#d9d5cc" font-size="19">and current order status.</text>
    <text x="124" y="426" fill="#d6fa5f" font-size="17" font-weight="700">Do not count parcels yet.</text>

    <path d="M392 360h44" stroke="#80704f" stroke-width="5" stroke-linecap="round"/>
    <path d="m426 348 14 12-14 12" fill="none" stroke="#80704f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="454" y="260" width="286" height="202" rx="22" fill="#efe6d5" stroke="#c8b99e" stroke-width="2"/>
    <circle cx="494" cy="305" r="20" fill="#151412"/>
    <text x="488" y="313" fill="#ffffff" font-size="22" font-weight="800">2</text>
    <text x="532" y="313" fill="#151412" font-size="24" font-weight="800">Tracking groups</text>
    <text x="486" y="356" fill="#514a3e" font-size="19">Map each number and</text>
    <text x="486" y="386" fill="#514a3e" font-size="19">shipment to its items.</text>
    <text x="486" y="426" fill="#514a3e" font-size="17" font-weight="700">Look for another parcel.</text>

    <path d="M754 360h44" stroke="#80704f" stroke-width="5" stroke-linecap="round"/>
    <path d="m788 348 14 12-14 12" fill="none" stroke="#80704f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="816" y="260" width="286" height="202" rx="22" fill="#d6fa5f"/>
    <circle cx="856" cy="305" r="20" fill="#151412"/>
    <text x="850" y="313" fill="#ffffff" font-size="22" font-weight="800">3</text>
    <text x="894" y="313" fill="#151412" font-size="24" font-weight="800">Received proof</text>
    <text x="848" y="356" fill="#2d3321" font-size="19">Photograph the label,</text>
    <text x="848" y="386" fill="#2d3321" font-size="19">contents and packaging.</text>
    <text x="848" y="426" fill="#151412" font-size="17" font-weight="700">Report the exact gap.</text>
  </g>
  <text x="92" y="526" fill="#6b6253" font-family="Arial, sans-serif" font-size="18">Original editorial diagram • no customer, order or carrier data</text>
</svg>
