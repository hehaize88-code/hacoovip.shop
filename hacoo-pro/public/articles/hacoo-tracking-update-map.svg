<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Hacoo tracking update decision map</title>
  <desc id="desc">Four evidence stages: order state, carrier assignment, last scan, and the next responsible contact.</desc>
  <rect width="1200" height="630" fill="#f3efe6"/>
  <rect x="54" y="54" width="1092" height="522" rx="30" fill="#fffdf8" stroke="#202a24" stroke-width="3"/>
  <text x="98" y="126" fill="#202a24" font-family="Arial, sans-serif" font-size="38" font-weight="700">Tracking has not updated</text>
  <text x="98" y="164" fill="#556158" font-family="Arial, sans-serif" font-size="20">Read the record in order. Do not diagnose the parcel from elapsed time alone.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(98 220)"><rect width="220" height="230" rx="22" fill="#e7efe5" stroke="#809579" stroke-width="2"/><circle cx="38" cy="40" r="20" fill="#294f3a"/><text x="31" y="48" fill="#fff" font-size="22" font-weight="700">1</text><text x="24" y="92" fill="#202a24" font-size="23" font-weight="700">Order state</text><text x="24" y="128" fill="#556158" font-size="17">Paid, preparing,</text><text x="24" y="154" fill="#556158" font-size="17">shipped or split?</text><text x="24" y="198" fill="#294f3a" font-size="15" font-weight="700">Save time checked</text></g>
    <path d="M330 335h44" stroke="#b57a36" stroke-width="5" stroke-linecap="round"/><path d="m363 323 15 12-15 12" fill="none" stroke="#b57a36" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(390 220)"><rect width="220" height="230" rx="22" fill="#f6ead8" stroke="#c89c62" stroke-width="2"/><circle cx="38" cy="40" r="20" fill="#8d5b22"/><text x="31" y="48" fill="#fff" font-size="22" font-weight="700">2</text><text x="24" y="92" fill="#202a24" font-size="23" font-weight="700">Carrier record</text><text x="24" y="128" fill="#556158" font-size="17">Name, tracking</text><text x="24" y="154" fill="#556158" font-size="17">number, official site</text><text x="24" y="198" fill="#8d5b22" font-size="15" font-weight="700">Match exact parcel</text></g>
    <path d="M622 335h44" stroke="#b57a36" stroke-width="5" stroke-linecap="round"/><path d="m655 323 15 12-15 12" fill="none" stroke="#b57a36" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(682 220)"><rect width="220" height="230" rx="22" fill="#e8edf1" stroke="#8397a3" stroke-width="2"/><circle cx="38" cy="40" r="20" fill="#365563"/><text x="31" y="48" fill="#fff" font-size="22" font-weight="700">3</text><text x="24" y="92" fill="#202a24" font-size="23" font-weight="700">Last event</text><text x="24" y="128" fill="#556158" font-size="17">Exact wording, place,</text><text x="24" y="154" fill="#556158" font-size="17">date and time zone</text><text x="24" y="198" fill="#365563" font-size="15" font-weight="700">Preserve, do not guess</text></g>
    <path d="M914 335h44" stroke="#b57a36" stroke-width="5" stroke-linecap="round"/><path d="m947 323 15 12-15 12" fill="none" stroke="#b57a36" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(974 220)"><rect width="124" height="230" rx="22" fill="#efe5e1" stroke="#a97869" stroke-width="2"/><circle cx="38" cy="40" r="20" fill="#704536"/><text x="31" y="48" fill="#fff" font-size="22" font-weight="700">4</text><text x="18" y="92" fill="#202a24" font-size="21" font-weight="700">Contact</text><text x="18" y="128" fill="#556158" font-size="15">Carrier or</text><text x="18" y="152" fill="#556158" font-size="15">Hacoo?</text><text x="18" y="198" fill="#704536" font-size="14" font-weight="700">One clear</text><text x="18" y="218" fill="#704536" font-size="14" font-weight="700">question</text></g>
  </g>
  <rect x="98" y="490" width="1000" height="48" rx="24" fill="#202a24"/>
  <text x="598" y="521" text-anchor="middle" fill="#fffdf8" font-family="Arial, sans-serif" font-size="18" font-weight="700">STATUS + CARRIER + LAST EVENT + TIME CHECKED = A USEFUL SUPPORT RECORD</text>
</svg>
