<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AllChinaBuy domestic shipping evidence ledger</title><desc id="desc">Four connected stages show seller order, China domestic carrier, warehouse receipt and separate international parcel planning.</desc><rect width="1600" height="900" fill="#111314"/><circle cx="1320" cy="130" r="250" fill="#c6ff3d" opacity=".08"/><text x="120" y="150" fill="#c6ff3d" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="5">DOMESTIC SHIPPING LEDGER</text><text x="120" y="220" fill="#f7f7f2" font-family="Arial,sans-serif" font-size="64" font-weight="800">Track each handoff.</text><text x="120" y="276" fill="#aeb6b1" font-family="Arial,sans-serif" font-size="25">Keep seller-to-warehouse evidence separate from the parcel home.</text><g font-family="Arial,sans-serif"><g transform="translate(120 390)"><rect width="300" height="260" rx="22" fill="#1d2120" stroke="#39413e" stroke-width="2"/><text x="30" y="55" fill="#c6ff3d" font-size="22" font-weight="700">01 · ORDER</text><text x="30" y="106" fill="#fff" font-size="29" font-weight="700">Seller record</text><text x="30" y="151" fill="#aeb6b1" font-size="20">variant · quantity</text><text x="30" y="185" fill="#aeb6b1" font-size="20">item amount</text><text x="30" y="219" fill="#aeb6b1" font-size="20">domestic delivery</text></g><path d="M440 520h70" stroke="#c6ff3d" stroke-width="5"/><path d="m495 502 25 18-25 18" fill="none" stroke="#c6ff3d" stroke-width="5"/><g transform="translate(530 390)"><rect width="300" height="260" rx="22" fill="#1d2120" stroke="#39413e" stroke-width="2"/><text x="30" y="55" fill="#c6ff3d" font-size="22" font-weight="700">02 · DISPATCH</text><text x="30" y="106" fill="#fff" font-size="29" font-weight="700">Domestic carrier</text><text x="30" y="151" fill="#aeb6b1" font-size="20">seller handoff</text><text x="30" y="185" fill="#aeb6b1" font-size="20">carrier movement</text><text x="30" y="219" fill="#aeb6b1" font-size="20">delivery evidence</text></g><path d="M850 520h70" stroke="#c6ff3d" stroke-width="5"/><path d="m905 502 25 18-25 18" fill="none" stroke="#c6ff3d" stroke-width="5"/><g transform="translate(940 390)"><rect width="300" height="260" rx="22" fill="#1d2120" stroke="#39413e" stroke-width="2"/><text x="30" y="55" fill="#c6ff3d" font-size="22" font-weight="700">03 · WAREHOUSE</text><text x="30" y="106" fill="#fff" font-size="29" font-weight="700">Receipt &amp; storage</text><text x="30" y="151" fill="#aeb6b1" font-size="20">identify order</text><text x="30" y="185" fill="#aeb6b1" font-size="20">inspect evidence</text><text x="30" y="219" fill="#aeb6b1" font-size="20">resolve mismatch</text></g><path d="M1260 520h70" stroke="#ffb44a" stroke-width="5" stroke-dasharray="12 10"/><path d="m1315 502 25 18-25 18" fill="none" stroke="#ffb44a" stroke-width="5"/><g transform="translate(1350 390)"><rect width="130" height="260" rx="22" fill="#242018" stroke="#705726" stroke-width="2"/><text x="22" y="55" fill="#ffb44a" font-size="20" font-weight="700">04</text><text x="22" y="99" fill="#fff" font-size="23" font-weight="700">NEW</text><text x="22" y="131" fill="#fff" font-size="23" font-weight="700">STAGE</text><text x="22" y="180" fill="#c6b997" font-size="18">parcel</text><text x="22" y="209" fill="#c6b997" font-size="18">planning</text></g></g><rect x="120" y="728" width="1360" height="2" fill="#39413e"/><text x="120" y="790" fill="#aeb6b1" font-family="Arial,sans-serif" font-size="23">Evidence first: current order screen → seller dispatch → carrier record → warehouse status.</text></svg>
