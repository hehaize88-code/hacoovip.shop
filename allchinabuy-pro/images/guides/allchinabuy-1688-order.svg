<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">1688 order verification workflow for AllChinaBuy</title>
  <desc id="desc">Four stages show checking a live 1688 offer, recording the selected tier and quantity, reviewing warehouse evidence, and planning the measured international parcel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111713"/>
      <stop offset="1" stop-color="#263128"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050805" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1410" cy="130" r="220" fill="#c9ff47" opacity=".08"/>
  <circle cx="160" cy="820" r="260" fill="#7be7c4" opacity=".06"/>

  <text x="110" y="120" fill="#c9ff47" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">1688 ORDER CHECK</text>
  <text x="110" y="181" fill="#f7f8f4" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">Verify each stage before the parcel moves.</text>
  <text x="110" y="226" fill="#bbc6bc" font-family="Arial, Helvetica, sans-serif" font-size="24">Offer facts → order specification → warehouse evidence → measured shipping decision</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(110 320)">
      <rect width="310" height="350" rx="28" fill="#f7f8f4"/>
      <circle cx="58" cy="58" r="28" fill="#c9ff47"/>
      <text x="58" y="67" text-anchor="middle" fill="#111713" font-size="25" font-weight="800">1</text>
      <text x="38" y="124" fill="#111713" font-size="27" font-weight="800">LIVE 1688 OFFER</text>
      <line x1="38" y1="148" x2="272" y2="148" stroke="#d8ddd7" stroke-width="2"/>
      <text x="38" y="194" fill="#3d493f" font-size="21">Seller + current link</text>
      <text x="38" y="234" fill="#3d493f" font-size="21">Variant + pack format</text>
      <text x="38" y="274" fill="#3d493f" font-size="21">Tier + domestic delivery</text>
      <rect x="38" y="300" width="174" height="8" rx="4" fill="#7be7c4"/>
    </g>

    <g transform="translate(465 320)">
      <rect width="310" height="350" rx="28" fill="#f7f8f4"/>
      <circle cx="58" cy="58" r="28" fill="#c9ff47"/>
      <text x="58" y="67" text-anchor="middle" fill="#111713" font-size="25" font-weight="800">2</text>
      <text x="38" y="124" fill="#111713" font-size="27" font-weight="800">ORDER AUDIT</text>
      <line x1="38" y1="148" x2="272" y2="148" stroke="#d8ddd7" stroke-width="2"/>
      <text x="38" y="194" fill="#3d493f" font-size="21">Imported option matches</text>
      <text x="38" y="234" fill="#3d493f" font-size="21">Quantity reaches tier</text>
      <text x="38" y="274" fill="#3d493f" font-size="21">Item-stage ledger saved</text>
      <rect x="38" y="300" width="204" height="8" rx="4" fill="#7be7c4"/>
    </g>

    <g transform="translate(820 320)">
      <rect width="310" height="350" rx="28" fill="#f7f8f4"/>
      <circle cx="58" cy="58" r="28" fill="#c9ff47"/>
      <text x="58" y="67" text-anchor="middle" fill="#111713" font-size="25" font-weight="800">3</text>
      <text x="38" y="124" fill="#111713" font-size="27" font-weight="800">WAREHOUSE</text>
      <line x1="38" y1="148" x2="272" y2="148" stroke="#d8ddd7" stroke-width="2"/>
      <text x="38" y="194" fill="#3d493f" font-size="21">Count + visible options</text>
      <text x="38" y="234" fill="#3d493f" font-size="21">Batch evidence sampled</text>
      <text x="38" y="274" fill="#3d493f" font-size="21">Mismatch resolved first</text>
      <rect x="38" y="300" width="189" height="8" rx="4" fill="#7be7c4"/>
    </g>

    <g transform="translate(1175 320)">
      <rect width="310" height="350" rx="28" fill="#f7f8f4"/>
      <circle cx="58" cy="58" r="28" fill="#c9ff47"/>
      <text x="58" y="67" text-anchor="middle" fill="#111713" font-size="25" font-weight="800">4</text>
      <text x="38" y="124" fill="#111713" font-size="27" font-weight="800">PARCEL PLAN</text>
      <line x1="38" y1="148" x2="272" y2="148" stroke="#d8ddd7" stroke-width="2"/>
      <text x="38" y="194" fill="#3d493f" font-size="21">Warehouse confirmed</text>
      <text x="38" y="234" fill="#3d493f" font-size="21">Packed weight + size</text>
      <text x="38" y="274" fill="#3d493f" font-size="21">Live route checked</text>
      <rect x="38" y="300" width="220" height="8" rx="4" fill="#7be7c4"/>
    </g>
  </g>

  <g fill="none" stroke="#c9ff47" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 495h23"/><path d="m445 483 12 12-12 12"/>
    <path d="M785 495h23"/><path d="m800 483 12 12-12 12"/>
    <path d="M1140 495h23"/><path d="m1155 483 12 12-12 12"/>
  </g>

  <rect x="110" y="746" width="1375" height="72" rx="18" fill="#c9ff47"/>
  <text x="797" y="792" text-anchor="middle" fill="#111713" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">A low unit price is useful only when the variant, quantity tier and delivered-cost plan agree.</text>
</svg>
