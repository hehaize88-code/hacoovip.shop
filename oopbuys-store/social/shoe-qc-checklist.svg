<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">OOPBUY shoe QC checklist</title><desc id="d">A warehouse shoe inspection board for identity, measurements, pair matching, condition and the final decision.</desc>
  <rect width="1200" height="630" fill="#f1eee6"/><rect x="42" y="42" width="1116" height="546" rx="30" fill="#0b1626"/>
  <text x="86" y="112" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#ff5a36">SHOE QC · WAREHOUSE DECISION BOARD</text>
  <text x="86" y="168" font-family="Georgia,serif" font-size="42" fill="#fff">Check the pair before you pay to ship it.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(86 224)"><rect width="192" height="226" rx="18" fill="#f8f6ef"/><text x="22" y="42" fill="#ff5a36" font-size="14" font-weight="700">01 · IDENTITY</text><path d="M45 104c32-24 63-15 85 2l24 19c10 8 5 28-9 29H36c-15 0-17-24-5-31z" fill="none" stroke="#132035" stroke-width="7"/><text x="22" y="190" fill="#344154" font-size="16">Model · color · size</text></g>
    <g transform="translate(294 224)"><rect width="192" height="226" rx="18" fill="#dce8f3"/><text x="22" y="42" fill="#ff5a36" font-size="14" font-weight="700">02 · MEASURE</text><path d="M36 92h120M36 92l16-12m-16 12 16 12m104-12-16-12m16 12-16 12" stroke="#132035" stroke-width="6"/><text x="22" y="138" fill="#132035" font-size="26" font-weight="700">cm, not labels</text><text x="22" y="190" fill="#344154" font-size="16">Insole · outsole</text></g>
    <g transform="translate(502 224)"><rect width="192" height="226" rx="18" fill="#f5ded1"/><text x="22" y="42" fill="#ff5a36" font-size="14" font-weight="700">03 · MATCH</text><circle cx="70" cy="110" r="35" fill="none" stroke="#132035" stroke-width="7"/><circle cx="124" cy="110" r="35" fill="none" stroke="#132035" stroke-width="7"/><text x="22" y="190" fill="#344154" font-size="16">Left · right · symmetry</text></g>
    <g transform="translate(710 224)"><rect width="192" height="226" rx="18" fill="#e8e2d5"/><text x="22" y="42" fill="#ff5a36" font-size="14" font-weight="700">04 · CONDITION</text><path d="M48 77l96 96m0-96-96 96" stroke="#132035" stroke-width="7" stroke-linecap="round"/><text x="22" y="190" fill="#344154" font-size="16">Glue · seams · soles</text></g>
    <g transform="translate(918 224)"><rect width="192" height="226" rx="18" fill="#f8f6ef"/><text x="22" y="42" fill="#ff5a36" font-size="14" font-weight="700">05 · DECIDE</text><text x="22" y="94" fill="#132035" font-size="22" font-weight="700">KEEP</text><text x="22" y="129" fill="#132035" font-size="22" font-weight="700">REPHOTO</text><text x="22" y="164" fill="#132035" font-size="22" font-weight="700">RETURN</text><text x="22" y="199" fill="#132035" font-size="22" font-weight="700">SHIP</text></g>
    <path d="M86 505H1110" stroke="#667085" stroke-width="2" stroke-dasharray="8 10"/><text x="86" y="550" fill="#c8d1dd" font-size="18">Visible evidence is useful. It cannot prove fit, materials, authenticity or durability.</text>
  </g>
</svg>
