<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OOPBUY image search dead-link recovery workflow</title>
  <desc id="desc">An editorial workflow from a failed product link through a reference image and candidate comparison to a verified live listing.</desc>
  <rect width="1200" height="630" fill="#f3f0e8"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="#091524"/>
  <text x="96" y="115" fill="#f15a31" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">DEAD-LINK RECOVERY</text>
  <text x="96" y="164" fill="#fff" font-family="Georgia, serif" font-size="39">Image search finds candidates.</text>
  <text x="96" y="207" fill="#fff" font-family="Georgia, serif" font-size="39">Live listing checks decide.</text>
  <g font-family="Arial, sans-serif">
    <rect x="96" y="272" width="200" height="190" rx="12" fill="#fff"/>
    <circle cx="196" cy="328" r="28" fill="#f15a31"/>
    <path d="M181 313l30 30m0-30-30 30" stroke="#fff" stroke-width="6"/>
    <text x="196" y="392" text-anchor="middle" fill="#091524" font-size="19" font-weight="700">FAILED LINK</text>
    <text x="196" y="421" text-anchor="middle" fill="#405169" font-size="15">keep its record</text>
    <path d="M310 367h64m-16-16 16 16-16 16" stroke="#f15a31" stroke-width="5" fill="none"/>
    <rect x="389" y="272" width="200" height="190" rx="12" fill="#fff"/>
    <rect x="437" y="304" width="104" height="70" rx="6" fill="#dfe7ee"/>
    <circle cx="515" cy="323" r="10" fill="#f15a31"/>
    <path d="M449 362l25-25 20 18 13-12 22 19" stroke="#405169" stroke-width="5" fill="none"/>
    <text x="489" y="407" text-anchor="middle" fill="#091524" font-size="19" font-weight="700">REFERENCE IMAGE</text>
    <text x="489" y="436" text-anchor="middle" fill="#405169" font-size="15">observable features</text>
    <path d="M603 367h64m-16-16 16 16-16 16" stroke="#f15a31" stroke-width="5" fill="none"/>
    <rect x="682" y="272" width="200" height="190" rx="12" fill="#fff"/>
    <rect x="722" y="306" width="120" height="18" rx="5" fill="#dfe7ee"/><rect x="722" y="337" width="88" height="18" rx="5" fill="#dfe7ee"/><rect x="722" y="368" width="105" height="18" rx="5" fill="#dfe7ee"/>
    <text x="782" y="421" text-anchor="middle" fill="#091524" font-size="19" font-weight="700">CANDIDATES</text>
    <text x="782" y="450" text-anchor="middle" fill="#405169" font-size="15">compare, don’t assume</text>
    <path d="M896 367h64m-16-16 16 16-16 16" stroke="#f15a31" stroke-width="5" fill="none"/>
    <rect x="975" y="272" width="129" height="190" rx="12" fill="#f15a31"/>
    <path d="M1008 338l21 21 43-48" stroke="#fff" stroke-width="8" fill="none"/>
    <text x="1039" y="407" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">LIVE</text>
    <text x="1039" y="432" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">CHECK</text>
  </g>
  <text x="96" y="525" fill="#a9b6c6" font-family="Arial, sans-serif" font-size="17">Preserve the old URL · compare selected variants · save a new dated row</text>
</svg>
