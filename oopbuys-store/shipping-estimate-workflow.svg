<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">OOPBuy shipping estimate workflow</title><desc id="d">Four steps show item estimates, warehouse data, packed measurements and eligible shipping routes.</desc><rect width="1200" height="630" fill="#fff8f2"/><rect x="55" y="55" width="1090" height="520" rx="34" fill="#171717"/><text x="105" y="135" fill="#ff7a3d" font-family="Arial,sans-serif" font-size="30" font-weight="700">SHIPPING ESTIMATE WORKFLOW</text><text x="105" y="181" fill="#ffffff" font-family="Arial,sans-serif" font-size="22">Replace assumptions with better parcel data at each step</text><g font-family="Arial,sans-serif"><g transform="translate(105 245)"><rect width="210" height="205" rx="22" fill="#2a2a2a" stroke="#ff7a3d" stroke-width="3"/><text x="24" y="43" fill="#ff7a3d" font-size="18" font-weight="700">01 · ITEM</text><text x="24" y="84" fill="#fff" font-size="23" font-weight="700">Early estimate</text><text x="24" y="122" fill="#cfcfcf" font-size="17">Seller or product</text><text x="24" y="148" fill="#cfcfcf" font-size="17">weight + dimensions</text></g><path d="M330 348h45" stroke="#ff7a3d" stroke-width="5"/><path d="m365 336 14 12-14 12" fill="none" stroke="#ff7a3d" stroke-width="5"/><g transform="translate(390 245)"><rect width="210" height="205" rx="22" fill="#2a2a2a"/><text x="24" y="43" fill="#ff7a3d" font-size="18" font-weight="700">02 · WAREHOUSE</text><text x="24" y="84" fill="#fff" font-size="23" font-weight="700">Stored data</text><text x="24" y="122" fill="#cfcfcf" font-size="17">Replace preliminary</text><text x="24" y="148" fill="#cfcfcf" font-size="17">inputs after intake</text></g><path d="M615 348h45" stroke="#ff7a3d" stroke-width="5"/><path d="m650 336 14 12-14 12" fill="none" stroke="#ff7a3d" stroke-width="5"/><g transform="translate(675 245)"><rect width="210" height="205" rx="22" fill="#2a2a2a"/><text x="24" y="43" fill="#ff7a3d" font-size="18" font-weight="700">03 · PACKED</text><text x="24" y="84" fill="#fff" font-size="23" font-weight="700">Parcel data</text><text x="24" y="122" fill="#cfcfcf" font-size="17">Outer weight, size</text><text x="24" y="148" fill="#cfcfcf" font-size="17">and selected services</text></g><path d="M900 348h45" stroke="#ff7a3d" stroke-width="5"/><path d="m935 336 14 12-14 12" fill="none" stroke="#ff7a3d" stroke-width="5"/><g transform="translate(960 245)"><rect width="160" height="205" rx="22" fill="#ff7a3d"/><text x="20" y="43" fill="#171717" font-size="18" font-weight="700">04 · ROUTES</text><text x="20" y="84" fill="#171717" font-size="23" font-weight="700">Compare</text><text x="20" y="122" fill="#171717" font-size="16">Eligibility</text><text x="20" y="147" fill="#171717" font-size="16">Billing</text><text x="20" y="172" fill="#171717" font-size="16">Tracking + cover</text></g></g><text x="105" y="520" fill="#d8d8d8" font-family="Arial,sans-serif" font-size="18">A quote becomes more useful as weight, dimensions and route rules become more certain.</text></svg>