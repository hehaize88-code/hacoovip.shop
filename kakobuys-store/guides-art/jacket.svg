<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc"><title id="title">Review the outside and the lining</title><desc id="desc">Jacket diagram of chest measurement, closure alignment and interior review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1759ff" stroke-width="1.4"/></marker></defs><rect width="800" height="800" fill="#f3eee4"/><g font-family="Arial,sans-serif" fill="#111414"><text x="48" y="63" font-size="18" letter-spacing="2">KAKOBUYS.STORE / QC FIELD GUIDE</text><text x="48" y="115" font-size="32" font-weight="700">Review the outside and the lining</text><path d="M270 275L205 305L126 455L203 493L255 401L255 614L545 614L545 401L597 493L674 455L595 305L530 275L470 225L330 225Z" fill="#cfff28" stroke="#111414" stroke-width="4"/><path d="M340 225L400 309L460 225M400 309V614" fill="none" stroke="#111414" stroke-width="5"/><path d="M284 487L350 471M450 471L516 487" stroke="#111414" stroke-width="4"/><path d="M263 398H537" stroke="#1759ff" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="298" y="384" font-size="20">Flat chest width</text><circle cx="263" cy="398" r="6" fill="#1759ff"/><circle cx="537" cy="398" r="6" fill="#1759ff"/><path d="M419 350L573 205" stroke="#1759ff" stroke-width="2"/><text x="492" y="185" font-size="21">Closure alignment</text><path d="M461 568L622 607" stroke="#1759ff" stroke-width="2"/><text x="570" y="647" font-size="21">Open for lining</text><text x="48" y="207" font-size="19">Flat view does not</text><text x="48" y="233" font-size="19">prove warmth or fit</text><path d="M48 698H752" stroke="#111414"/><text x="48" y="734" font-size="19">Original diagram • not a warehouse photo</text><text x="48" y="766" font-size="16">Confirm the view, endpoints and live order before deciding.</text></g></svg>