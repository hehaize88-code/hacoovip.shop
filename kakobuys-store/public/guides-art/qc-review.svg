<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc"><title id="title">One doubt. One useful request.</title><desc id="desc">Four editorial steps for choosing an extra warehouse photograph.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1759ff" stroke-width="1.4"/></marker></defs><rect width="800" height="800" fill="#f3eee4"/><g font-family="Arial,sans-serif" fill="#111414"><text x="48" y="63" font-size="18" letter-spacing="2">KAKOBUYS.STORE / QC FIELD GUIDE</text><text x="48" y="115" font-size="32" font-weight="700">One doubt. One useful request.</text><rect x="48" y="192" width="704" height="100" rx="4" fill="#cfff28" stroke="#111414" stroke-width="2"/><text x="72" y="247" font-size="32" font-weight="700">01</text><text x="157" y="228" font-size="23" font-weight="700">IDENTITY</text><text x="157" y="264" font-size="20">Match the exact order and variant.</text><rect x="48" y="311" width="704" height="100" rx="4" fill="#cda8ff" stroke="#111414" stroke-width="2"/><text x="72" y="366" font-size="32" font-weight="700">02</text><text x="157" y="347" font-size="23" font-weight="700">MISSING EVIDENCE</text><text x="157" y="383" font-size="20">Name the area, angle or endpoints.</text><rect x="48" y="430" width="704" height="100" rx="4" fill="#cfff28" stroke="#111414" stroke-width="2"/><text x="72" y="485" font-size="32" font-weight="700">03</text><text x="157" y="466" font-size="23" font-weight="700">TARGETED REQUEST</text><text x="157" y="502" font-size="20">Keep the detail connected to the item.</text><rect x="48" y="549" width="704" height="100" rx="4" fill="#cda8ff" stroke="#111414" stroke-width="2"/><text x="72" y="604" font-size="32" font-weight="700">04</text><text x="157" y="585" font-size="23" font-weight="700">DECISION</text><text x="157" y="621" font-size="20">Ship, clarify or use live after-sales.</text><path d="M48 698H752" stroke="#111414"/><text x="48" y="734" font-size="19">Original diagram • not a warehouse photo</text><text x="48" y="766" font-size="16">Confirm the view, endpoints and live order before deciding.</text></g></svg>