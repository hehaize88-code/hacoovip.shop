<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Superbuy first order workflow</title><desc id="d">Five stages from product link verification to shopping-agent purchase, seller dispatch and warehouse decision.</desc><rect width="1200" height="630" fill="#087eea"/><circle cx="1050" cy="90" r="190" fill="#d9ff43" opacity=".95"/><text x="70" y="105" fill="#d9ff43" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="4">FIRST ORDER WORKFLOW</text><text x="70" y="180" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="800">Product link → warehouse</text><text x="70" y="225" fill="#dbeeff" font-family="Arial,sans-serif" font-size="21">Shopping Agent stages kept separate from the later international parcel.</text><g font-family="Arial,sans-serif" transform="translate(70 330)"><g fill="#f3f0e8" stroke="#061425" stroke-width="3"><rect width="180" height="150"/><rect x="220" width="180" height="150"/><rect x="440" width="180" height="150"/><rect x="660" width="180" height="150"/><rect x="880" width="180" height="150"/></g><g fill="#061425" font-weight="700"><text x="20" y="38" font-size="17">01 · VERIFY</text><text x="20" y="82" font-size="24">Live link</text><text x="20" y="115" font-size="16">seller · variant</text><text x="240" y="38" font-size="17">02 · ORDER</text><text x="240" y="82" font-size="24">Exact brief</text><text x="240" y="115" font-size="16">price · delivery</text><text x="460" y="38" font-size="17">03 · BUY</text><text x="460" y="82" font-size="24">Agent stage</text><text x="460" y="115" font-size="16">messages · changes</text><text x="680" y="38" font-size="17">04 · DISPATCH</text><text x="680" y="82" font-size="24">China leg</text><text x="680" y="115" font-size="16">seller → warehouse</text><text x="900" y="38" font-size="17">05 · DECIDE</text><text x="900" y="82" font-size="24">Warehouse</text><text x="900" y="115" font-size="16">inspect · act</text></g></g><text x="70" y="560" fill="#fff" font-family="Arial,sans-serif" font-size="18">The international parcel begins only after the item is accepted in storage.</text></svg>
