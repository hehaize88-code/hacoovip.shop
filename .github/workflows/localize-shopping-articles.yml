name: Localize shopping articles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/localize-shopping-articles.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localize-shopping-articles
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        language: [de, fr, es, it, nl, pt, pl, ro, sv, zh-CN, da, fi, el, cs, hu, bg, sk, hr, ja, ko, vi, th, id]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shopping-editorial/localize.py
            /*/editorial-config.json
            /*/editorial-content.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ctranslate2==4.9.1 sentencepiece==0.2.3
      - name: Translate the published texts
        run: python shopping-editorial/localize.py translate --lang "${{ matrix.language }}"
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ matrix.language }}
          path: localized-output/
          retention-days: 1
  publish:
    needs: translate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shopping-editorial/localize.py
            /*/editorial-config.json
            /*/editorial-content.json
            /*/editorial-locales.json
      - uses: actions/download-artifact@v4
        with:
          pattern: editorial-*
          path: localized-output
          merge-multiple: true
      - run: python shopping-editorial/localize.py assemble
      - name: Publish verified translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/editorial-locales.json'
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete local translations for the shopping guides"
            git push origin HEAD:main
          fi
