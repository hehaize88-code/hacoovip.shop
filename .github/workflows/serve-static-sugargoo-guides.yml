name: Preserve full Sugargoo guide hub

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/serve-static-sugargoo-guides.yml'

permissions:
  contents: write

jobs:
  upgrade-sugargoo-uk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow lxml
          npm install --no-save jsdom@24

      - name: Generate UK-first spreadsheet, products, category pages and deep guides
        run: |
          python sugargoovip-preview/tools/upgrade_uk_seo_20260808.py

      - name: Validate JavaScript syntax
        run: |
          node --check sugargoovip-preview/_worker.js
          node --check sugargoovip-preview/assets/i18n-uk-20260808.js
          node --check sugargoovip-preview/assets/language-fix-uk-20260808.js
          for f in sugargoovip-preview/assets/reverse-articles/*.js; do node --check "$f"; done

      - name: Test language switching on the same page
        run: |
          cat > .tmp-sugargoo-language.mjs <<'JS'
          import fs from 'node:fs';
          import {JSDOM} from 'jsdom';
          const base='sugargoovip-preview';
          const i18n=fs.readFileSync(`${base}/assets/i18n-uk-20260808.js`,'utf8');
          const fix=fs.readFileSync(`${base}/assets/language-fix-uk-20260808.js`,'utf8');
          const wait=dom=>new Promise(r=>dom.window.setTimeout(r,30));
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function boot(file,url,stored,extra){
            const dom=new JSDOM(fs.readFileSync(`${base}/${file}`,'utf8'),{url,runScripts:'outside-only'});
            if(stored)dom.window.localStorage.setItem('sugargooLang',stored);
            dom.window.eval(i18n); dom.window.eval(fix);
            if(extra)dom.window.eval(fs.readFileSync(`${base}/${extra}`,'utf8'));
            dom.window.document.dispatchEvent(new dom.window.Event('DOMContentLoaded',{bubbles:true}));
            await wait(dom); return dom;
          }
          async function choose(dom,lang){const s=dom.window.document.querySelector('.language-select');s.value=lang;s.dispatchEvent(new dom.window.Event('change',{bubbles:true}));await wait(dom);}
          const home=await boot('index.html','https://sugargoovip.uk/','en');
          assert(home.window.document.title==='Sugargoo Spreadsheet UK 2026: Product Finds, QC & Shipping','wrong home title');
          assert(home.window.document.querySelector('h1').textContent.includes('Sugargoo Spreadsheet UK'),'wrong H1');
          await choose(home,'it'); assert(home.window.location.pathname==='/'&&home.window.location.search.includes('lang=it'),'Italian left home'); assert(home.window.document.querySelector('.language-select').value==='it','Italian reverted');
          await choose(home,'en'); assert(home.window.location.pathname==='/'&&!home.window.location.search.includes('lang='),'English left home'); assert(home.window.document.querySelector('.language-select').value==='en','English reverted');
          await choose(home,'de'); assert(home.window.location.pathname==='/'&&home.window.location.search.includes('lang=de'),'German left home');
          const articleFile='guides/sugargoo-reverse-shopping-multi-item-order-ledger.html';
          const article=await boot(articleFile,`https://sugargoovip.uk/${articleFile}`,'en','assets/reverse-articles/multi-item-order-ledger.js');
          assert(article.window.document.querySelector('.article-card h1').textContent.startsWith('How to Organize'),'English article not default');
          await choose(article,'it'); assert(article.window.location.pathname===`/${articleFile}`,'Italian article jumped'); assert(article.window.document.querySelector('.article-card h1').textContent.startsWith('Come organizzare'),'Italian full article failed');
          await choose(article,'zh'); assert(article.window.location.pathname===`/${articleFile}`,'Chinese article jumped'); assert(article.window.document.querySelector('.article-card h1').textContent.includes('反向代购'),'Chinese full article failed');
          console.log('PASS same-page language switching');
          JS
          node .tmp-sugargoo-language.mjs

      - name: Validate SEO surface
        shell: python
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import xml.etree.ElementTree as ET
          import re
          base=Path('sugargoovip-preview')
          assert len(list((base/'products').glob('*.html')))==41
          assert len(list((base/'assets/catalog').glob('*.webp')))==40
          for slug in ['shoes','hoodies-sweaters','t-shirts','jackets','pants-shorts','headwear','accessories','electronics']:
              s=BeautifulSoup((base/f'categories/{slug}.html').read_text(encoding='utf-8'),'html.parser')
              assert len(s.select('.product-card'))==5,(slug,len(s.select('.product-card')))
          for f in ['sugargoo-warehouse-guide.html','sugargoo-spreadsheet-guide.html','sugargoo-uk-shipping-guide.html','qc-guide.html']:
              s=BeautifulSoup((base/'guides'/f).read_text(encoding='utf-8'),'html.parser')
              n=len(re.findall(r"\b[A-Za-z0-9][A-Za-z0-9’'\-]*\b",s.select_one('.article-content').get_text(' ',strip=True)))
              assert 1200<=n<=1800,(f,n)
          root=ET.parse(base/'sitemap-index.xml').getroot();ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          children=root.findall('s:sitemap',ns);assert len(children)==1
          assert children[0].find('s:loc',ns).text=='https://sugargoovip.uk/sitemap.xml'
          assert (base/'robots.txt').read_text(encoding='utf-8').count('Sitemap:')==1
          assert 'data-title-key' not in BeautifulSoup((base/'index.html').read_text(encoding='utf-8'),'html.parser').body.attrs
          print('PASS 40 products, 8 category landing pages, deep guides and one sitemap index')
          PY

      - name: Restore this workflow and commit tested output
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/serve-static-sugargoo-guides.yml
          rm -rf .github/workflows/upgrade-sugargoovip-uk-seo-20260808.yml .tmp-sugargoo-language.mjs node_modules package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade Sugargoo UK spreadsheet SEO and catalog'
          git push origin HEAD:main
