name: Align Sugargoo homepage featured finds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sugargoovip-final-home-schema.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install beautifulsoup4
      - name: Align cards and JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json

          p=Path('sugargoovip-preview/index.html')
          soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
          cards=soup.select('.home-products .product-card')
          assert len(cards)==8, len(cards)

          last=cards[-1]
          last['href']='/products/accessories-5945.html'
          img=last.find('img'); img['src']='/assets/catalog/accessories-5945.webp'; img['alt']='VANS Velcro tri-fold canvas sports wallet product find'
          last.find('h3').string='VANS Velcro Tri-Fold Canvas Sports Wallet'
          last.find('p').string='Accessories · listing checked'

          featured=[
            ('shoes-6045.html','Curated Shoes Find 6045'),
            ('hoodies-sweaters-5974.html','Patagonia Classic Loose-Fitting Crew Neck'),
            ('t-shirts-5976.html','Gucci Pique Cotton Polo'),
            ('jackets-5981.html','Celine Embroidered Chocolate Jacket'),
            ('hoodies-sweaters-5970.html','Miu Miu Collared Patchwork Casual Top'),
            ('pants-shorts-5979.html','Balenciaga Vintage Washed Denim Jeans'),
            ('headwear-5971.html','Miu Miu Letter-Embroidered Headwear'),
            ('accessories-5945.html','VANS Velcro Tri-Fold Canvas Sports Wallet'),
          ]
          script=soup.find('script',attrs={'type':'application/ld+json'})
          graph=json.loads(script.string)
          item=next(x for x in graph['@graph'] if x.get('@type')=='ItemList')
          item['name']='Featured Sugargoo Spreadsheet UK product finds'
          item['numberOfItems']=8
          item['itemListElement']=[{'@type':'ListItem','position':i,'url':'https://sugargoovip.uk/products/'+slug,'name':name} for i,(slug,name) in enumerate(featured,1)]
          page=next(x for x in graph['@graph'] if x.get('@type')=='CollectionPage')
          page['dateModified']='2026-08-10'
          script.string=json.dumps(graph,ensure_ascii=False,separators=(',',':'))
          p.write_text(str(soup),encoding='utf-8')

          check=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
          assert check.select('.home-products .product-card')[-1]['href']=='/products/accessories-5945.html'
          data=json.loads(check.find('script',attrs={'type':'application/ld+json'}).string)
          item=next(x for x in data['@graph'] if x.get('@type')=='ItemList')
          assert [x['url'].rsplit('/',1)[-1] for x in item['itemListElement']]==[x[0] for x in featured]
          for slug,_ in featured:
              assert (Path('sugargoovip-preview/products')/slug).exists(), slug
          PY
      - name: Commit aligned homepage
        run: |
          rm -f .github/workflows/sugargoovip-final-home-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Sugargoo homepage featured finds with static catalogue'
          git push origin HEAD:main
