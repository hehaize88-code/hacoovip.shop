# Merge-triggered one-time upgrade: 2026-08-08
name: Upgrade Sugargoo VIP UK SEO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-sugargoovip-uk-seo-20260808.yml'

permissions:
  contents: write

jobs:
  upgrade-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow lxml

      - name: Generate UK spreadsheet upgrade
        run: python sugargoovip-preview/tools/upgrade_uk_seo_20260808.py

      - name: Validate JavaScript syntax
        run: |
          node --check sugargoovip-preview/_worker.js
          node --check sugargoovip-preview/assets/i18n-uk-20260808.js
          node --check sugargoovip-preview/assets/language-fix-uk-20260808.js
          for f in sugargoovip-preview/assets/reverse-articles/*.js; do node --check "$f"; done

      - name: Run DOM language regression tests
        run: |
          npm install --no-save jsdom@24
          cat > .tmp-sugargoovip-uk-test.mjs <<'JS'
          import fs from 'node:fs';
          import {JSDOM} from 'jsdom';

          const base='sugargoovip-preview';
          const i18n=fs.readFileSync(`${base}/assets/i18n-uk-20260808.js`,'utf8');
          const fix=fs.readFileSync(`${base}/assets/language-fix-uk-20260808.js`,'utf8');
          const wait=dom=>new Promise(resolve=>dom.window.setTimeout(resolve,30));
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)};

          async function boot(file,url,stored,extra){
            const html=fs.readFileSync(`${base}/${file}`,'utf8');
            const dom=new JSDOM(html,{url,runScripts:'outside-only'});
            if(stored) dom.window.localStorage.setItem('sugargooLang',stored);
            dom.window.eval(i18n);
            dom.window.eval(fix);
            if(extra) dom.window.eval(fs.readFileSync(`${base}/${extra}`,'utf8'));
            dom.window.document.dispatchEvent(new dom.window.Event('DOMContentLoaded',{bubbles:true}));
            await wait(dom);
            return dom;
          }

          async function choose(dom,lang){
            const select=dom.window.document.querySelector('.language-select');
            assert(select,`Missing selector for ${lang}`);
            select.value=lang;
            select.dispatchEvent(new dom.window.Event('change',{bubbles:true}));
            await wait(dom);
          }

          const home=await boot('index.html','https://sugargoovip.uk/','en');
          assert(home.window.document.title==='Sugargoo Spreadsheet UK 2026: Product Finds, QC & Shipping','Homepage SEO title changed unexpectedly');
          assert(home.window.document.querySelector('h1').textContent.includes('Sugargoo Spreadsheet UK'),'Homepage H1 is not UK spreadsheet target');
          await choose(home,'it');
          assert(home.window.localStorage.getItem('sugargooLang')==='it','Italian state not saved');
          assert(home.window.document.querySelector('.language-select').value==='it','Italian selector reverted');
          assert(home.window.location.pathname==='/' && home.window.location.search.includes('lang=it'),'Italian changed page instead of same-page state');
          await choose(home,'en');
          assert(home.window.document.querySelector('.language-select').value==='en','English selector reverted');
          assert(home.window.location.pathname==='/' && !home.window.location.search.includes('lang='),'English did not remain on homepage');
          await choose(home,'de');
          assert(home.window.document.querySelector('.language-select').value==='de','German selector failed');
          assert(home.window.location.pathname==='/' && home.window.location.search.includes('lang=de'),'German did not stay on same page');

          const articleFile='guides/sugargoo-reverse-shopping-multi-item-order-ledger.html';
          const article=await boot(articleFile,`https://sugargoovip.uk/${articleFile}`,'en','assets/reverse-articles/multi-item-order-ledger.js');
          await wait(article);
          assert(article.window.document.querySelector('.article-card h1').textContent.startsWith('How to Organize'),'English article is not the static default');
          await choose(article,'it');
          assert(article.window.location.pathname===`/${articleFile}`,'Italian article switch left current article');
          assert(article.window.document.querySelector('.article-card h1').textContent.startsWith('Come organizzare'),'Italian full article did not render');
          await choose(article,'zh');
          assert(article.window.location.pathname===`/${articleFile}`,'Chinese article switch left current article');
          assert(article.window.document.querySelector('.article-card h1').textContent.includes('反向代购'),'Chinese full article did not render');
          await choose(article,'en');
          assert(article.window.document.querySelector('.article-card h1').textContent.startsWith('How to Organize'),'Article did not return to English');

          console.log('PASS: UK homepage, same-page language switching and full reverse-shopping article localization.');
          JS
          node .tmp-sugargoovip-uk-test.mjs

      - name: Validate generated SEO surface
        shell: python
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import xml.etree.ElementTree as ET
          import re

          base=Path('sugargoovip-preview')
          products=list((base/'products').glob('*.html'))
          assert len(products)==41, len(products)
          assert len(list((base/'assets/catalog').glob('*.webp')))==40
          for slug in ['shoes','hoodies-sweaters','t-shirts','jackets','pants-shorts','headwear','accessories','electronics']:
              soup=BeautifulSoup((base/f'categories/{slug}.html').read_text(encoding='utf-8'),'html.parser')
              assert len(soup.select('.product-card'))==5, slug
          for file in ['sugargoo-warehouse-guide.html','sugargoo-spreadsheet-guide.html','sugargoo-uk-shipping-guide.html','qc-guide.html']:
              soup=BeautifulSoup((base/'guides'/file).read_text(encoding='utf-8'),'html.parser')
              words=len(re.findall(r"\b[A-Za-z0-9][A-Za-z0-9’'\-]*\b",soup.select_one('.article-content').get_text(' ',strip=True)))
              assert 1200<=words<=1800,(file,words)
          root=ET.parse(base/'sitemap-index.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          children=root.findall('s:sitemap',ns)
          assert len(children)==1
          assert children[0].find('s:loc',ns).text=='https://sugargoovip.uk/sitemap.xml'
          assert (base/'robots.txt').read_text(encoding='utf-8').count('Sitemap:')==1
          print('PASS: 40 products, 8 category landers, four deep guides, single sitemap index.')
          PY

      - name: Commit tested upgrade
        run: |
          set -euo pipefail
          rm -rf .github/workflows/upgrade-sugargoovip-uk-seo-20260808.yml .tmp-sugargoovip-uk-test.mjs node_modules package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade Sugargoo UK spreadsheet SEO and catalog'
          git push origin HEAD:main
