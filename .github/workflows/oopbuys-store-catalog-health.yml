name: OOPBuy catalog health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oopbuys-store-catalog-health
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh link and price evidence
        run: node .github/scripts/update-oopbuys-store-catalog-health.mjs

      - name: Commit a fresh public status record
        shell: bash
        run: |
          git config user.name "oopbuys-store health monitor"
          git config user.email "actions@users.noreply.github.com"
          git add oopbuys-store/data/catalog-health.json
          if git diff --cached --quiet
          then
            echo "No catalog status change."
            exit 0
          fi
          git commit -m "Refresh OOPBuy catalog health"
          git pull --rebase origin main
          git push origin HEAD:main
