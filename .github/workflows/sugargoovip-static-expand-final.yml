name: Sugargoo VIP static catalogue final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sugargoovip-static-expand-final.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install requests beautifulsoup4 pillow lxml

      - name: Generate and verify Sugargoo VIP catalogue
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sugargoovip-preview/tools/upgrade_uk_seo_20260808.py')
          s=p.read_text(encoding='utf-8')
          target='    patch_worker(static_paths, canonical_html)\n'
          if target not in s:
              raise SystemExit('patch_worker call missing')
          s=s.replace(target,'    # current Worker core already owns canonical routing\n',1)
          old='''    worker = (BASE / "_worker.js").read_text(encoding="utf-8")
    assert "UK_STATIC_OVERRIDES" in worker and "UK_CANONICAL_HTML" in worker
    assert "__legacyLocale" in worker and ".html';" in worker
'''
          new='''    worker = (BASE / "_worker.js").read_text(encoding="utf-8")
    core = (BASE / "worker-core-uk-20260808.js").read_text(encoding="utf-8")
    assert "worker-core-uk-20260808.js" in worker
    assert "__legacyLocale" in core and "canonicalExtension" in core
'''
          if old not in s:
              raise SystemExit('old Worker validation block missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python sugargoovip-preview/tools/upgrade_uk_seo_20260808.py
          printf '%s\n' '{' '  "version": 1,' '  "include": ["/*"],' '  "exclude": []' '}' > sugargoovip-preview/_routes.json
          cat > sugargoovip-preview/sitemap-index.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <sitemap>
              <loc>https://sugargoovip.uk/sitemap.xml</loc>
              <lastmod>2026-08-10</lastmod>
            </sitemap>
          </sitemapindex>
          EOF
          printf '%s\n' 'User-agent: *' 'Allow: /' '' 'Sitemap: https://sugargoovip.uk/sitemap-index.xml' > sugargoovip-preview/robots.txt
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re
          b=Path('sugargoovip-preview')
          files=list((b/'products').glob('*.html'))
          assert len(files)==41, len(files)
          for slug in ['shoes','hoodies-sweaters','t-shirts','jackets','pants-shorts','headwear','accessories','electronics']:
              q=b/'categories'/f'{slug}.html'
              assert q.exists(), slug
              assert len(BeautifulSoup(q.read_text(encoding='utf-8'),'html.parser').select('.product-card'))==5
          for name in ['sugargoo-warehouse-guide.html','sugargoo-spreadsheet-guide.html','sugargoo-uk-shipping-guide.html','qc-guide.html']:
              soup=BeautifulSoup((b/'guides'/name).read_text(encoding='utf-8'),'html.parser')
              n=len(re.findall(r"\b[A-Za-z0-9][A-Za-z0-9’'\-]*\b",soup.select_one('.article-content').get_text(' ',strip=True)))
              assert 1200<=n<=1800,(name,n)
          assert (b/'sitemap.xml').read_text(encoding='utf-8').count('<url>')>=79
          assert 'worker-core-uk-20260808.js' in (b/'_worker.js').read_text(encoding='utf-8')
          print('validated 40 products, 8 categories and 4 deep guides')
          PY
          git checkout -- sugargoovip-preview/tools/upgrade_uk_seo_20260808.py

      - name: Commit generated files
        run: |
          rm -f .github/workflows/sugargoovip-static-expand-final.yml .github/workflows/upgrade-sugargoovip-uk-seo-20260810.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Sugargoo UK 40-product spreadsheet expansion'
          git push origin HEAD:main
