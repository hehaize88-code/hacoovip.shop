name: Install per-site GA4 tags

on:
  push:
    branches:
      - "codex/add-ga4-tags-20260825"
    paths:
      - ".github/workflows/install-ga4-tags.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-ga4-tags-20260825
      - name: Add the correct tag to every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          mapping = {
              "acbuy-ro": "G-KDK1GGZBP7",
              "allchinabuy-pro": "G-4S8LT5M79M",
              "allchinabuy-ro": "G-J8E9BDTGDW",
              "findqc-pro": "G-H87FLTGFRR",
              "hacoo-pro": "G-SJ7LTZ5CP2",
              "hacoo-store": "G-KVZZSJN8W2",
              "hacoovip-shop": "G-1L4E2PD8XB",
              "kakobuys-pro": "G-LMWSBTNCWX",
              "kakobuys-shop": "G-PDS13PB9CC",
              "kakobuys-store": "G-L9YML1CM7K",
              "oopbuys-pro": "G-EQ0HWP86CP",
              "oopbuys-store": "G-BLPXS6DRGC",
              "sheet-hipobuy-net": "G-XC17DVXPLC",
              "sheet-superbuy-com": "G-P91GYCQQPL",
              "spreadsheet-hipobuy-net": "G-KR0Y8RYEX1",
              "spreadsheets-superbuy-net": "G-NPK3BPNZMW",
              "sugargoos-de": "G-39LKQRSNHV",
              "sugargoovip-preview": "G-LCE7C7PN4P",
              "superbuys-id": "G-8XL6GVTEJY",
              "superbuys-pro": "G-MGRK9E4V6G",
              "superbuys-store": "G-1QS8EWYKPX",
              "usfanss-es": "G-56TMQMXE1J",
              "usfanss-pl": "G-HX4MTTJWZF",
              "usfanss-store": "G-BCNPML3ZE2",
              "usfanss-uk": "G-D7Y831DZC2",
          }

          head_re = re.compile(r"(<head(?:\s[^>]*)?>)", re.I)
          ga_re = re.compile(r"G-[A-Z0-9]{6,}")
          directive_re = {
              "script-src": re.compile(r"(script-src\s+)([^;]+)", re.I),
              "connect-src": re.compile(r"(connect-src\s+)([^;]+)", re.I),
          }

          def add_csp_sources(text, directive, sources):
              pattern = directive_re[directive]
              def update(match):
                  body = match.group(2)
                  for source in sources:
                      if source not in body:
                          body += " " + source
                  return match.group(1) + body
              return pattern.sub(update, text, count=1)

          changed = 0
          for folder, measurement_id in mapping.items():
              root = Path(folder)
              if not root.is_dir():
                  raise SystemExit(f"Missing site directory: {folder}")
              snippet = f"""<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{measurement_id}');
          </script>"""
              tagged = 0
              for page in root.rglob("*.html"):
                  text = page.read_text(encoding="utf-8")
                  if measurement_id in text:
                      tagged += 1
                      continue
                  ids = set(ga_re.findall(text))
                  if ids:
                      raise SystemExit(f"Unexpected GA ID in {page}: {sorted(ids)}")
                  updated, count = head_re.subn(lambda m: m.group(1) + "\n" + snippet, text, count=1)
                  if count:
                      page.write_text(updated, encoding="utf-8", newline="")
                      tagged += 1
                      changed += 1
              if not tagged:
                  raise SystemExit(f"No HTML page tagged for {folder}")

              worker = root / "_worker.js"
              if worker.exists():
                  text = worker.read_text(encoding="utf-8")
                  if "Content-Security-Policy" in text:
                      updated = add_csp_sources(
                          text, "script-src",
                          ["'unsafe-inline'", "https://www.googletagmanager.com"],
                      )
                      updated = add_csp_sources(
                          updated, "connect-src",
                          ["https://*.google-analytics.com", "https://*.analytics.google.com"],
                      )
                      if updated != text:
                          worker.write_text(updated, encoding="utf-8", newline="")
                          changed += 1

          print(f"Updated {changed} files")
      - name: Commit generated tracking tags
        shell: bash
        run: |
          git config user.name "hehaize88-code"
          git config user.email "hehaize88-code@users.noreply.github.com"
          git add -- acbuy-ro allchinabuy-pro allchinabuy-ro findqc-pro hacoo-pro hacoo-store hacoovip-shop kakobuys-pro kakobuys-shop kakobuys-store oopbuys-pro oopbuys-store sheet-hipobuy-net sheet-superbuy-com spreadsheet-hipobuy-net spreadsheets-superbuy-net sugargoos-de sugargoovip-preview superbuys-id superbuys-pro superbuys-store usfanss-es usfanss-pl usfanss-store usfanss-uk
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add per-site GA4 tracking tags"
            git push origin HEAD:codex/add-ga4-tags-20260825
          fi
